<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <rect width="64" height="64" rx="12" fill="#0b1b36"/>
  <!-- Blueprint Grid lines -->
  <line x1="0" y1="16" x2="64" y2="16" stroke="#005bc5" stroke-width="0.75" stroke-dasharray="2,2" opacity="0.6"/>
  <line x1="0" y1="32" x2="64" y2="32" stroke="#005bc5" stroke-width="0.75" stroke-dasharray="2,2" opacity="0.6"/>
  <line x1="0" y1="48" x2="64" y2="48" stroke="#005bc5" stroke-width="0.75" stroke-dasharray="2,2" opacity="0.6"/>
  <line x1="16" y1="0" x2="16" y2="64" stroke="#005bc5" stroke-width="0.75" stroke-dasharray="2,2" opacity="0.6"/>
  <line x1="32" y1="0" x2="32" y2="64" stroke="#005bc5" stroke-width="0.75" stroke-dasharray="2,2" opacity="0.6"/>
  <line x1="48" y1="0" x2="48" y2="64" stroke="#005bc5" stroke-width="0.75" stroke-dasharray="2,2" opacity="0.6"/>
  
  <!-- Rocket Airframe CAD Icon -->
  <g transform="translate(32, 32) rotate(45) translate(-16, -16)">
    <!-- Fuselage Body -->
    <path d="M16 2 L23 14 L23 24 L16 28 L9 24 L9 14 Z" fill="#00f2fe" opacity="0.85" stroke="#ffffff" stroke-width="1.2"/>
    <!-- Nose Cone -->
    <path d="M16 2 L21 11 L11 11 Z" fill="#ffffff"/>
    <!-- Left Fin -->
    <path d="M9 18 L3 26 L9 24 Z" fill="#005bc5" stroke="#00f2fe" stroke-width="1"/>
    <!-- Right Fin -->
    <path d="M23 18 L29 26 L23 24 Z" fill="#005bc5" stroke="#00f2fe" stroke-width="1"/>
    <!-- Exhaust Plume flame -->
    <path d="M13 28 L16 34 L19 28 Z" fill="#ff4d4d"/>
    <!-- Crosshair drafting circle -->
    <circle cx="16" cy="16" r="14" fill="none" stroke="#00f2fe" stroke-width="1" stroke-dasharray="3,2" opacity="0.7"/>
  </g>
</svg>
